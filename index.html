<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Shared Grocery List</title>

    <!-- PWA Metadata & Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Groceries" />
    <link
      rel="apple-touch-icon"
      href="https://cdn-icons-png.flaticon.com/512/3081/3081017.png"
    />

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800 pb-16 font-sans">
    <div class="max-w-md mx-auto p-4 sm:p-6">
      <!-- Header & Sync Status -->
      <header
        class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 mb-4"
      >
        <div class="flex items-center justify-between mb-3">
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">
            🛒 Grocery List
          </h1>
          <div
            id="sync-status"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800"
          >
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            Connecting...
          </div>
        </div>

        <!-- Room Sharing Controls -->
        <div
          class="bg-slate-50 p-3 rounded-xl border border-slate-200/60 text-xs text-slate-600 flex items-center justify-between gap-2"
        >
          <div class="truncate">
            <span class="font-semibold text-slate-700">Room:</span>
            <span
              id="room-id-display"
              class="font-mono text-slate-900 bg-white px-1.5 py-0.5 rounded border border-slate-200"
            ></span>
          </div>
          <div class="flex gap-1.5">
            <button
              onclick="copyInviteLink()"
              class="bg-blue-600 text-white px-2.5 py-1 rounded-lg font-medium hover:bg-blue-700 transition active:scale-95"
            >
              📋 Copy Link
            </button>
            <button
              onclick="promptChangeRoom()"
              class="bg-slate-200 text-slate-700 px-2 py-1 rounded-lg font-medium hover:bg-slate-300 transition"
            >
              Change
            </button>
          </div>
        </div>
      </header>

      <!-- Add Item Form -->
      <form id="add-form" class="flex gap-2 mb-4">
        <input
          type="text"
          id="item-input"
          placeholder="Add item (e.g. Oat Milk)..."
          required
          class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white shadow-sm text-sm"
        />
        <button
          type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-3 rounded-xl shadow-sm transition active:scale-95 text-sm"
        >
          Add
        </button>
      </form>

      <!-- Grocery Items List -->
      <ul id="grocery-list" class="space-y-2"></ul>
    </div>

    <script>
      // --- Dev / Sync Toggle ---
      const DISABLE_SYNC = true; // Set to false when ready to test real-time sync again

      // --- Register Service Worker for PWA Installation ---
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("SW Registered"))
            .catch((err) => console.error("SW Registration Failed:", err));
        });
      }

      // --- Room & Identity Setup ---
      const SENDER_ID = "usr_" + Math.random().toString(36).substring(2, 9);

      function getRoomFromUrl() {
        const hash = window.location.hash.replace("#", "");
        const params = new URLSearchParams(hash);
        return params.get("room");
      }

      let room = getRoomFromUrl() || localStorage.getItem("pwa_grocery_room");
      if (!room) {
        room = "grocery-" + Math.random().toString(36).substring(2, 8);
      }
      localStorage.setItem("pwa_grocery_room", room);
      window.location.hash = `room=${room}`;
      document.getElementById("room-id-display").textContent = room;

      // --- IndexedDB Database Setup ---
      let db;
      const dbReq = indexedDB.open("GroceryDB", 2);

      dbReq.onupgradeneeded = (e) => {
        db = e.target.result;
        // Nobody has real data yet; drop the v1 store and build the v2 schema.
        if (db.objectStoreNames.contains("items")) {
          db.deleteObjectStore("items");
        }
        const items = db.createObjectStore("items", { keyPath: "id" });
        items.createIndex("byList", "list", { unique: false });
        const products = db.createObjectStore("products", { keyPath: "id" });
        products.createIndex("byList", "list", { unique: false });
        const history = db.createObjectStore("purchaseHistory", {
          keyPath: "id",
        });
        history.createIndex("byList", "list", { unique: false });
      };

      dbReq.onsuccess = (e) => {
        db = e.target.result;
        renderList();
        initSync();
      };

      // --- DB Helper Functions ---
      function uid(prefix) {
        return (
          prefix +
          Date.now() +
          "_" +
          Math.random().toString(36).substring(2, 6)
        );
      }

      async function getAllItems() {
        return new Promise((resolve) => {
          const tx = db.transaction("items", "readonly");
          const req = tx.objectStore("items").index("byList").getAll(room);
          req.onsuccess = () => resolve(req.result || []);
        });
      }

      async function putItem(item, broadcast = true) {
        const tx = db.transaction("items", "readwrite");
        tx.objectStore("items").put(item);
        tx.oncomplete = () => {
          renderList();
          if (broadcast) {
            publishAction({ type: "PUT_ITEM", item });
          }
        };
      }

      async function deleteItem(id, broadcast = true) {
        const tx = db.transaction("items", "readwrite");
        tx.objectStore("items").delete(id);
        tx.oncomplete = () => {
          renderList();
          if (broadcast) {
            publishAction({ type: "DELETE_ITEM", id });
          }
        };
      }

      async function getAllProducts() {
        return new Promise((resolve) => {
          const tx = db.transaction("products", "readonly");
          const req = tx.objectStore("products").index("byList").getAll(room);
          req.onsuccess = () => resolve(req.result || []);
        });
      }

      async function putProduct(product, broadcast = true) {
        const tx = db.transaction("products", "readwrite");
        tx.objectStore("products").put(product);
        tx.oncomplete = () => {
          if (broadcast) {
            publishAction({ type: "PUT_PRODUCT", product });
          }
        };
      }

      async function deleteProduct(id, broadcast = true) {
        const tx = db.transaction("products", "readwrite");
        tx.objectStore("products").delete(id);
        tx.oncomplete = () => {
          if (broadcast) {
            publishAction({ type: "DELETE_PRODUCT", id });
          }
        };
      }

      // --- Real-time Sync Engine via ntfy.sh ---
      let eventSource = null;

      function updateStatusUI(status) {
        const el = document.getElementById("sync-status");
        if (status === "connected") {
          el.className =
            "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800";
          el.innerHTML =
            '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Connected';
        } else if (status === "connecting") {
          el.className =
            "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800";
          el.innerHTML =
            '<span class="w-2 h-2 rounded-full bg-amber-500"></span> Connecting...';
        } else {
          el.className =
            "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-rose-100 text-rose-800";
          el.innerHTML =
            '<span class="w-2 h-2 rounded-full bg-rose-500"></span> Offline';
        }
      }

      function initSync() {
        if (eventSource) {
          eventSource.close();
          eventSource = null;
        }

        if (DISABLE_SYNC) {
          const el = document.getElementById("sync-status");
          el.className =
            "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-200 text-slate-700";
          el.innerHTML =
            '<span class="w-2 h-2 rounded-full bg-slate-400"></span> Dev Mode (Sync Off)';
          return;
        }

        updateStatusUI("connecting");
        const sseUrl = `https://ntfy.sh/${encodeURIComponent(room)}/sse?since=12h`;
        eventSource = new EventSource(sseUrl);

        eventSource.onopen = () => {
          updateStatusUI("connected");
          publishAction({ type: "REQUEST_SYNC" });
        };

        eventSource.onerror = () => {
          updateStatusUI("offline");
        };

        eventSource.onmessage = async (e) => {
          try {
            const ntfyData = JSON.parse(e.data);
            if (ntfyData.event !== "message" || !ntfyData.message) return;

            const action = JSON.parse(ntfyData.message);
            if (action.senderId === SENDER_ID) return;

            await handleRemoteAction(action);
          } catch (err) {}
        };
      }

      async function publishAction(action) {
        if (DISABLE_SYNC) return; // Prevent network requests during dev

        action.senderId = SENDER_ID;
        try {
          await fetch(`https://ntfy.sh/${encodeURIComponent(room)}`, {
            method: "POST",
            body: JSON.stringify(action),
          });
        } catch (err) {
          console.error("Publish error:", err);
        }
      }

      async function handleRemoteAction(action) {
        if (action.type === "PUT_ITEM") {
          const products = await getAllProducts();
          if (!products.some((p) => p.id === action.item.productId)) {
            // Unknown Product: pull the full List state instead of storing a dangling Item.
            publishAction({ type: "REQUEST_SYNC" });
            return;
          }
          await putItem(action.item, false);
        } else if (action.type === "DELETE_ITEM") {
          await deleteItem(action.id, false);
        } else if (action.type === "PUT_PRODUCT") {
          await putProduct(action.product, false);
        } else if (action.type === "DELETE_PRODUCT") {
          await deleteProduct(action.id, false);
        } else if (action.type === "REQUEST_SYNC") {
          const [items, products] = await Promise.all([
            getAllItems(),
            getAllProducts(),
          ]);
          publishAction({ type: "FULL_SYNC", items, products });
        } else if (action.type === "FULL_SYNC") {
          if (Array.isArray(action.items)) {
            for (const item of action.items) {
              await putItem(item, false);
            }
          }
          if (Array.isArray(action.products)) {
            for (const product of action.products) {
              await putProduct(product, false);
            }
          }
        }
      }

      // --- UI Rendering & Actions ---
      async function renderList() {
        const items = await getAllItems();
        const products = await getAllProducts();
        const productById = new Map(products.map((p) => [p.id, p]));
        const listEl = document.getElementById("grocery-list");

        items.sort(
          (a, b) => a.completed - b.completed || b.createdAt - a.createdAt,
        );

        if (items.length === 0) {
          listEl.innerHTML = `
          <li class="text-center py-8 text-slate-400 text-sm">
            Your list is empty. Add an item above!
          </li>`;
          return;
        }

        listEl.innerHTML = items
          .map((item) => {
            const product = productById.get(item.productId);
            const text = product ? product.defaultSpelling : "…";
            return `
        <li class="flex items-center justify-between p-3.5 bg-white rounded-xl border border-slate-200/80 shadow-sm transition">
          <label class="flex items-center gap-3 flex-1 cursor-pointer select-none">
            <input 
              type="checkbox" 
              ${item.completed ? "checked" : ""} 
              onchange="toggleCheck('${item.id}', this.checked)"
              class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 transition"
            >
            <span class="text-sm font-medium ${item.completed ? "line-through text-slate-400" : "text-slate-800"}">
              ${escapeHtml(text)}
            </span>
          </label>
          <button onclick="removeItem('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </button>
        </li>
      `;
          })
          .join("");
      }

      // --- Catalog & Add Flow ---
      function normalizeText(str) {
        return str.toLowerCase().replace(/\s+/g, " ").trim();
      }

      function levenshtein(a, b) {
        const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
        for (let j = 0; j <= b.length; j++) dp[0][j] = j;
        for (let i = 1; i <= a.length; i++) {
          for (let j = 1; j <= b.length; j++) {
            dp[i][j] = Math.min(
              dp[i - 1][j] + 1,
              dp[i][j - 1] + 1,
              dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
            );
          }
        }
        return dp[a.length][b.length];
      }

      async function resolveProduct(text) {
        const normalized = normalizeText(text);
        const products = await getAllProducts();

        const exact = products.find(
          (p) =>
            normalizeText(p.defaultSpelling) === normalized ||
            p.aliases.some((a) => normalizeText(a) === normalized),
        );
        if (exact) return exact;

        let best = null;
        let bestDist = Infinity;
        for (const p of products) {
          for (const spelling of [p.defaultSpelling, ...p.aliases]) {
            const dist = levenshtein(normalized, normalizeText(spelling));
            if (dist < bestDist) {
              bestDist = dist;
              best = p;
            }
          }
        }
        const threshold = normalized.length < 5 ? 1 : 2;
        if (best && bestDist <= threshold) {
          if (confirm(`Did you mean "${best.defaultSpelling}"?`)) {
            if (!best.aliases.some((a) => normalizeText(a) === normalized)) {
              best.aliases.push(text);
              await putProduct(best, true);
            }
            return best;
          }
        }

        const product = {
          id: `${room}::${uid("prod_")}`,
          list: room,
          defaultSpelling: text,
          aliases: [],
        };
        await putProduct(product, true);
        return product;
      }

      async function addOrReviveItem(product) {
        const items = await getAllItems();
        const existing = items.find(
          (i) => i.productId === product.id && !i.completed,
        );
        if (existing) return;

        const bought = items.find(
          (i) => i.productId === product.id && i.completed,
        );
        if (bought) {
          bought.completed = false;
          bought.createdAt = Date.now();
          await putItem(bought, true);
          return;
        }

        const item = {
          id: `${room}::${uid("item_")}`,
          list: room,
          productId: product.id,
          completed: false,
          createdAt: Date.now(),
        };
        await putItem(item, true);
      }

      document.getElementById("add-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("item-input");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        resolveProduct(text).then((product) => {
          if (product) {
            addOrReviveItem(product);
          }
        });
      });

      async function toggleCheck(id, completed) {
        const items = await getAllItems();
        const item = items.find((i) => i.id === id);
        if (item) {
          item.completed = completed;
          putItem(item, true);
        }
      }

      function removeItem(id) {
        deleteItem(id, true);
      }

      function copyInviteLink() {
        const url =
          window.location.origin +
          window.location.pathname +
          "#room=" +
          encodeURIComponent(room);
        navigator.clipboard.writeText(url).then(() => {
          alert("Invite link copied! Open this URL on your second device.");
        });
      }

      function promptChangeRoom() {
        const newRoom = prompt("Enter room name:", room);
        if (newRoom && newRoom.trim() !== room) {
          room = newRoom.trim();
          localStorage.setItem("pwa_grocery_room", room);
          window.location.hash = `room=${room}`;
          document.getElementById("room-id-display").textContent = room;
          initSync();
          renderList();
        }
      }

      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      }
    </script>
  </body>
</html>
