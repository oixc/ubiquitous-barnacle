<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Shared Grocery List</title>

    <!-- PWA Metadata & Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Groceries" />
    <link
      rel="apple-touch-icon"
      href="https://cdn-icons-png.flaticon.com/512/3081/3081017.png"
    />

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 min-h-screen text-slate-200 pb-16 font-sans">
    <div class="max-w-md mx-auto p-4 sm:p-6">
      <!-- Header & Sync Status -->
      <header
        class="bg-slate-900 rounded-2xl p-5 shadow-sm border border-slate-800 mb-4"
      >
        <div class="flex items-center justify-between mb-3">
          <h1 class="text-xl font-bold text-white tracking-tight">
            🛒 Grocery List
          </h1>
          <div
            id="sync-status"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-950/60 text-amber-300"
          >
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            Connecting...
          </div>
        </div>

        <!-- List Sharing Controls -->
        <div
          class="bg-slate-950/50 p-3 rounded-xl border border-slate-800 text-xs text-slate-400 flex items-center justify-between gap-2"
        >
          <div class="truncate">
            <span class="font-semibold text-slate-300">List:</span>
            <span
              id="list-id-display"
              class="font-mono text-slate-100 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-700"
            ></span>
          </div>
          <div class="flex gap-1.5">
            <button
              data-action="copy-link"
              class="bg-blue-600 text-white px-2.5 py-1 rounded-lg font-medium hover:bg-blue-700 transition active:scale-95"
            >
              📋 Copy Link
            </button>
            <button
              data-action="change-list"
              class="bg-slate-800 text-slate-200 px-2 py-1 rounded-lg font-medium hover:bg-slate-700 transition"
            >
              Change
            </button>
          </div>
        </div>
      </header>

      <!-- Add Item Form -->
      <form id="add-form" class="flex gap-2 mb-4">
        <input
          type="text"
          id="item-input"
          placeholder="Add item (e.g. Oat Milk)..."
          required
          class="flex-1 px-4 py-3 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-900 shadow-sm text-sm text-slate-100 placeholder-slate-500"
        />
        <button
          type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-3 rounded-xl shadow-sm transition active:scale-95 text-sm"
        >
          Add
        </button>
      </form>

      <!-- Grocery Items List -->
      <ul id="grocery-list" class="space-y-2"></ul>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
