<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>"
    />

    <!-- PWA Metadata & Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Shopping List" />
    <link
      rel="apple-touch-icon"
      href="https://cdn-icons-png.flaticon.com/512/3081/3081017.png"
    />

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 min-h-screen text-slate-200 pb-16 font-sans">
    <div class="max-w-md mx-auto p-4 sm:p-6">
      <!-- Header & Sync Status -->
      <header
        class="bg-slate-900 rounded-2xl p-5 shadow-sm border border-slate-800 mb-4"
      >
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <button
              data-action="open-menu"
              id="menu-btn"
              aria-label="Open menu"
              title="Menu"
              aria-expanded="false"
              class="p-1.5 -ml-1 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition"
            >
              <span data-icon="menu" class="block w-6 h-6"></span>
            </button>
            <h1 class="text-xl font-bold text-white tracking-tight">
              🛒 Shopping List
            </h1>
          </div>
          <div
            id="sync-status"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-950/60 text-amber-300"
          >
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            Connecting...
          </div>
        </div>
      </header>

      <!-- List View -->
      <section id="view-list">
        <!-- Add Item Form -->
        <form id="add-form" class="flex gap-2 mb-4">
          <input
            type="text"
            id="item-input"
            placeholder="I need ..."
            required
            class="flex-1 px-4 py-3 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-900 shadow-sm text-sm text-slate-100 placeholder-slate-500"
          />
          <button
            type="submit"
            aria-label="Add item"
            title="Add item"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-xl shadow-sm transition active:scale-95"
          >
            <span data-icon="plus" class="block w-5 h-5"></span>
          </button>
        </form>

        <!-- Preset quick-choice chips for the resolved Product -->
        <div id="preset-chips" class="mb-4 hidden"></div>

        <!-- Purchase Suggestions (device-local restock prompts) -->
        <div id="suggestions" class="mb-4"></div>

        <!-- Grocery Items List -->
        <ul id="grocery-list" class="space-y-2"></ul>
      </section>

      <!-- Catalog View -->
      <section id="view-catalog" class="space-y-2 hidden"></section>

      <!-- Purchase History View (device-local) -->
      <section id="view-history" class="space-y-2 hidden"></section>
    </div>

    <!-- Slide-out Menu -->
    <div
      id="drawer-overlay"
      data-action="close-menu"
      class="fixed inset-0 z-40 bg-black/50 opacity-0 pointer-events-none transition-opacity duration-200"
    ></div>
    <aside
      id="drawer"
      aria-label="Menu"
      class="fixed top-0 left-0 z-50 h-full w-72 bg-slate-900 border-r border-slate-800 shadow-xl flex flex-col transform -translate-x-full transition-transform duration-200"
    >
      <div
        class="flex items-center justify-between p-4 border-b border-slate-800"
      >
        <span class="font-semibold text-white">Groceries</span>
        <button
          data-action="close-menu"
          aria-label="Close menu"
          title="Close"
          class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
        >
          <span data-icon="close" class="block w-5 h-5"></span>
        </button>
      </div>
      <nav class="p-2 space-y-1">
        <button
          data-action="view-list"
          data-view="list"
          aria-current="true"
          class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium bg-slate-800 text-white transition"
        >
          <span data-icon="cart" class="block w-5 h-5"></span>
          List
        </button>
        <button
          data-action="view-catalog"
          data-view="catalog"
          class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 transition"
        >
          <span data-icon="book" class="block w-5 h-5"></span>
          Catalog
        </button>
        <button
          data-action="view-history"
          data-view="history"
          class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 transition"
        >
          <span data-icon="clock" class="block w-5 h-5"></span>
          Purchase history
        </button>
      </nav>
      <div class="p-2 border-t border-slate-800">
        <button
          data-action="refresh"
          aria-label="Refresh"
          title="Pull the latest list and catalog from other devices"
          class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 transition"
        >
          <span data-icon="refresh" class="block w-5 h-5"></span>
          Refresh
        </button>
      </div>
      <div class="mt-auto p-4 border-t border-slate-800">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-400">List</span>
          <div class="flex gap-1.5">
            <button
              data-action="copy-link"
              aria-label="Copy invite link"
              title="Copy invite link"
              class="bg-blue-600 text-white p-2 rounded-lg font-medium hover:bg-blue-700 transition active:scale-95"
            >
              <span data-icon="copy" class="block w-5 h-5"></span>
            </button>
            <button
              data-action="change-list"
              aria-label="Change list"
              title="Change list"
              class="bg-slate-800 text-slate-200 p-2 rounded-lg font-medium hover:bg-slate-700 transition"
            >
              <span data-icon="pencil" class="block w-5 h-5"></span>
            </button>
          </div>
        </div>
        <div
          id="drawer-list-name"
          class="text-sm font-mono text-slate-200 truncate"
        ></div>
        <div
          id="drawer-sync-count"
          class="text-xs text-slate-500 mt-1"
        ></div>
        <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-800/60">
          <span class="text-xs font-medium text-slate-400">Sync</span>
          <button
            id="sync-toggle"
            data-action="toggle-sync"
            aria-pressed="true"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-950/60 text-emerald-300 border border-emerald-800/60 transition"
          >
            <span data-sync-toggle-state>On</span>
          </button>
        </div>
      </div>
    </aside>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
